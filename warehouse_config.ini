[configuration]
display = 1
simulation = 1
mqtt = 0
robot = 0
obstacle = 5
seed = 150
field = 2
debug = 1
waittime = 300
step = 500

[environment]
rows = 15
columns = 20

[display]
x = 10
y = 210
width = 1000
height = 750
title = Warehouse AMR Simulation

[color]
robot   = 0,120,255
goal    = 0,200,120
other   = 160,110,255
obstacle= 100,100,100
unknown = 180,180,180

[warehouse]
# Number of pallets to generate
total_pallets = 200
# Probability of pallet arrival per tick (0.0 - 1.0)
# This is the TOTAL probability split across all entry areas
arrival_probability = 0.15
# Arrival distribution: binomial | poisson | uniform | geometric
arrival_distribution = binomial
# Number of fixed obstacles (static, placed with smart spacing)
num_obstacles = 5
# Number of human workers (dynamic obstacles that move randomly)
num_humans = 3
# Number of AMRs for enhanced mode
num_amrs = 5
# Battery configuration (enhanced mode)
max_battery = 100
recharge_rate = 5
# Intermediate area capacity (enhanced mode, max pallets per area)
intermediate_capacity = 5
# Layout: number of entry, exit, and intermediate areas
num_entry_areas = 3
num_exit_areas = 2
num_intermediate_areas = 2

# Explicit positions (row:col pairs, comma-separated)
# If set, overrides num_*_areas and auto-placement.
# If not set, areas are placed automatically (exits left, entries right, etc.)
entry_positions = 2:18,7:18,12:18
exit_positions = 2:1,12:1
intermediate_positions = 5:7,10:7
recharge_positions = 7:5,7:14
obstacle_positions = 3:6,5:10,8:4,10:12,12:8

# Algorithm configuration — best choices from experiments
# pathfinding_mode: bfs | dijkstra | astar | astar_penalties | astar_diagonal
pathfinding_mode = astar_diagonal
# allocation_mode: random | greedy | round_robin | least_utilized | cnp
allocation_mode = cnp
# conflict_resolution: none | random | priority
conflict_resolution = priority
# recharge_threshold: 0.0-1.0 (fraction of max battery to trigger recharge)
recharge_threshold = 0.4
# relay_strategy: never | always | adaptive
relay_strategy = adaptive
